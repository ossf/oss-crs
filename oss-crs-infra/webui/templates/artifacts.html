<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>{{ atype }} · {{ run_id }}</title>
<style>
  :root { --bg:#0f1117; --card:#181b24; --border:#252a36; --text:#e6e9ef;
          --muted:#8b93a7; --accent:#4f8cff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 28px 20px; }
  a { color: var(--accent); text-decoration: none; }
  .back { font-size: 13px; color: var(--muted); }
  h1 { font-size: 20px; margin: 12px 0 2px; }
  h1 .type { text-transform: capitalize; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; word-break: break-all; }
  .list { background:var(--card); border:1px solid var(--border); border-radius:10px;
          overflow:hidden; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:12px;
         padding:12px 16px; border-top:1px solid var(--border); cursor:pointer;
         transition: background 0.12s; }
  .row:first-child { border-top:none; }
  .row:hover { background:#20242f; }
  .fname { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:13px;
           word-break:break-all; }
  .meta { display:flex; align-items:center; gap:14px; flex:0 0 auto; }
  .size { color:var(--muted); font-size:12px; }
  .dl { color:var(--accent); font-size:12px; font-weight:600; white-space:nowrap; }
  .empty { color:var(--muted); padding:28px 16px; text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/run/{{ run_id }}">&larr; back to run</a>
  <h1><span class="type">{{ atype }}</span> <span id="count" class="size"></span></h1>
  <div class="sub">run: {{ run_id }}</div>
  <div class="list" id="list"><div class="empty">Loading…</div></div>
</div>
<script>
  var RUN_ID = {{ run_id | tojson }};
  var ATYPE = {{ atype | tojson }};
  function fmtSize(n){ var u=["B","KB","MB","GB"]; var i=0; while(n>=1024&&i<3){n/=1024;i++;}
    return (i===0? n : n.toFixed(1)) + " " + u[i]; }
  function dlUrl(name){ return "/api/runs/"+encodeURIComponent(RUN_ID)+"/artifacts/"
    +encodeURIComponent(ATYPE)+"/download?name="+encodeURIComponent(name); }
  fetch("/api/runs/"+encodeURIComponent(RUN_ID)+"/artifacts/"+encodeURIComponent(ATYPE))
    .then(function(r){ return r.json(); })
    .then(function(d){
      var arts = (d && d.artifacts) || [];
      var el = document.getElementById("list");
      document.getElementById("count").textContent = "(" + arts.length + ")";
      if(!arts.length){ el.innerHTML = '<div class="empty">No '+ATYPE+' artifacts.</div>'; return; }
      el.innerHTML = "";
      arts.forEach(function(a){
        var row = document.createElement("a");
        row.className = "row"; row.href = dlUrl(a.name);
        row.innerHTML = '<span class="fname"></span>'
          + '<span class="meta"><span class="size"></span><span class="dl">Download &darr;</span></span>';
        row.querySelector(".fname").textContent = a.name;
        row.querySelector(".size").textContent = fmtSize(a.size);
        el.appendChild(row);
      });
    })
    .catch(function(){ document.getElementById("list").innerHTML =
      '<div class="empty">Failed to load artifacts.</div>'; });
</script>
</body>
</html>
